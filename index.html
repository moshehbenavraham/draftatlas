    <!-- Anti-FOUC: apply the persisted/system theme before first paint so dark-OS
         visitors don't see a flash of the light palette. Must run synchronously
         in <head> ahead of the React bundle. Mirrors the storageKey used by
         ThemeProvider in src/main.tsx ("architecture-theme"). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('architecture-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved =
            stored === 'dark' || stored === 'light'
              ? stored
              : prefersDark
              ? 'dark'
              : 'light';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(resolved);
          root.style.colorScheme = resolved;
        } catch (e) {
          // localStorage / matchMedia unavailable - leave defaults in place
        }
      })();
    </script>

    <!-- Site-wide JSON-LD: Organization + WebSite. Per-route components
         (e.g. BlogPosting on /blog/:id) inject additional schema at runtime. -->
    <script type="application/ld+json">
